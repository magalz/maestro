name: Setup-only Sonar analysis

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require Sonar authentication
        env:
          HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
        run: |
          if [ "$HAS_SONAR_TOKEN" != true ]; then
            echo '::error::SONAR_TOKEN repository secret is required.'
            exit 1
          fi

      - name: Check out evaluated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install matching Rust analysis and coverage tools
        run: rustup toolchain install 1.98.1 --profile minimal --component llvm-tools-preview --component clippy --target x86_64-unknown-linux-gnu

      - name: Measure existing development smoke execution
        run: bash tools/coverage.sh

      - name: Analyze setup source and wait for quality gate
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          scannerVersion: 8.1.0.6389
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
