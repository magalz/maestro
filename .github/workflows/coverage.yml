name: Foundation coverage

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  foundation-coverage:
    name: foundation-coverage
    if: github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out evaluated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Node and bundled npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          architecture: x64
          package-manager-cache: false

      - name: Install matching Rust coverage tools
        run: rustup toolchain install 1.98.1 --profile minimal --component llvm-tools-preview --target x86_64-unknown-linux-gnu

      - name: Measure Rust and TypeScript foundation tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          bash tools/coverage.sh
          git diff --exit-code HEAD --

      - name: Retain exact coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundation-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/rust.lcov
            coverage/typescript.lcov
          retention-days: 7
          if-no-files-found: error

      - name: Upload foundation coverage to Codecov Cloud
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          version: v11.3.1
          files: coverage/rust.lcov,coverage/typescript.lcov
          disable_search: true
          plugins: noop
          flags: foundation
          name: rust-typescript-foundation
          override_commit: ${{ github.sha }}
          fail_ci_if_error: true
